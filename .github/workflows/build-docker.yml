# GitHub Actions workflow to build and push the agent image.
# Lives in the Agent repository. Deployment is a separate manual workflow.

name: Build and Push history-cache-agent Docker Image

on:
  push:
    branches: [main, feature/*]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: stockfeng/history-cache-agent

jobs:
  regression:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build-and-test:
    needs: regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Offline deployment recovery regression
        run: |
          bash -n docker/deploy-agent.sh
          timeout --kill-after=5s 60s python3 -B -m unittest discover -s tests -p 'test_deploy*.py'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record immutable deployment input
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf 'Agent image: `%s/%s@%s`\n\nrelease_commit: `%s`\n\nNo node was deployed.\n' \
            "$REGISTRY" "$IMAGE_NAME" "$IMAGE_DIGEST" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
