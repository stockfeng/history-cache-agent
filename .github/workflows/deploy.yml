name: Deploy history-cache-agent (single node)

on:
  workflow_dispatch:
    inputs:
      target:
        description: Only this node is contacted; Cloud is never deployed
        type: choice
        options: [test-vps, oracle, aliyun]
        required: true
      operation:
        description: Preflight is read-only; accept discards the stopped Agent backup
        type: choice
        options: [preflight, deploy, status, rollback, recover, accept, install-policy]
        default: preflight
        required: true
      release_commit:
        description: Full reviewed commit SHA; deploy requires the image revision to match
        type: string
        required: true
      image:
        description: ghcr.io/stockfeng/history-cache-agent@sha256:... (deploy only)
        type: string
      bake_seconds:
        description: Local UDS observation, 30-600 seconds
        type: number
        default: 120
      adjustment:
        description: Enable existing stock adjustment support (not futures/options)
        type: boolean
        default: true
      policy_release_tag:
        description: Reviewed policy release asset tag (install-policy only)
        type: string
      policy_sha256:
        description: Reviewed suspension JSON SHA256 (install-policy only)
        type: string
      policy_previous_sha256:
        description: Optional exact installed SHA256 for additive policy upgrade; old intervals retained
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: history-cache-agent-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  agent:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: history-cache-${{ inputs.target }}
    steps:
      - name: Validate reviewed commit
        env:
          RELEASE_COMMIT: ${{ inputs.release_commit }}
        run: '[[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.release_commit }}
          persist-credentials: false
      - name: Offline deployment regression
        run: |
          bash -n docker/deploy-agent.sh
          timeout --kill-after=5s 60s python3 -B -m unittest discover -s tests -p 'test_deploy*.py'
      - name: SSH password transport dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass
      - name: Download pinned non-secret policy asset
        if: inputs.operation == 'install-policy'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          POLICY_TAG: ${{ inputs.policy_release_tag }}
          POLICY_SHA256: ${{ inputs.policy_sha256 }}
        run: |
          [[ "$POLICY_TAG" =~ ^suspension-policy-[0-9A-Za-z.-]+$ ]]
          [[ "$POLICY_SHA256" =~ ^[0-9a-f]{64}$ ]]
          mkdir -m 700 "$RUNNER_TEMP/reviewed-policy"
          timeout --kill-after=5s 90s gh release download "$POLICY_TAG" --pattern suspensions.json --dir "$RUNNER_TEMP/reviewed-policy"
          printf '%s  %s\n' "$POLICY_SHA256" "$RUNNER_TEMP/reviewed-policy/suspensions.json" | sha256sum --check --status
      - name: Agent-only operation
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          AGENT_TARGET: ${{ inputs.target }}
          AGENT_OPERATION: ${{ inputs.operation }}
          AGENT_IMAGE: ${{ inputs.image }}
          AGENT_RELEASE_COMMIT: ${{ inputs.release_commit }}
          AGENT_BAKE_SECONDS: ${{ inputs.bake_seconds }}
          AGENT_ADJUSTMENT: ${{ inputs.adjustment }}
          AGENT_SSH_KEY: ${{ secrets.AGENT_SSH_KEY }}
          AGENT_SSH_PASSWORD: ${{ secrets.AGENT_SSH_PASSWORD }}
          AGENT_SSH_KNOWN_HOSTS: ${{ secrets.AGENT_SSH_KNOWN_HOSTS }}
          AGENT_R2_CREDENTIALS_JSON: ${{ secrets.AGENT_R2_CREDENTIALS_JSON }}
          AGENT_STORAGE_READER_JSON: ${{ secrets.AGENT_STORAGE_READER_JSON }}
          AGENT_GHCR_USER: ${{ github.actor }}
          AGENT_GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AGENT_POLICY_DIRECTORY: ${{ runner.temp }}/reviewed-policy
          AGENT_POLICY_SHA256: ${{ inputs.policy_sha256 }}
          AGENT_POLICY_PREVIOUS_SHA256: ${{ inputs.policy_previous_sha256 }}
        run: python3 -B docker/actions_deploy.py
