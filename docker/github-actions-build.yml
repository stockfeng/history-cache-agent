# GitHub Actions workflow to build and push the agent image.
# Lives in the history-v2-integration repository (or its cloud deploy mirror).

name: Build history-cache-agent

on:
  push:
    branches: [main]
    paths:
      - "components/history-cache/**"
      - ".github/workflows/history-cache-agent.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: stockfeng/history-cache-agent

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Offline deployment recovery regression
        working-directory: components/history-cache
        run: |
          bash -n docker/deploy-agent.sh
          timeout --kill-after=5s 60s python3 -B -m unittest discover -s tests -p 'test_deploy*.py'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and test
        working-directory: components/history-cache
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DHISTORY_CACHE_CURL=ON
          cmake --build build -j$(nproc)
          ctest --test-dir build --output-on-failure

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: components/history-cache
          file: components/history-cache/docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
